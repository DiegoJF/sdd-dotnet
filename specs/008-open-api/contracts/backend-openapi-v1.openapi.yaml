openapi: 3.0.3
info:
  title: Realtor API - Contrato Publico OpenAPI v1
  version: v1
  description: >-
    Contrato HTTP publico versionado de RealtorApi generado desde la implementacion
    real del backend Minimal APIs. Este documento se publica en /openapi/v1.json
    y excluye cualquier interfaz interactiva de documentacion.
servers:
  - url: http://localhost:5023
paths:
  /health:
    get:
      operationId: getHealth
      summary: Verifica disponibilidad del servicio
      responses:
        '200':
          description: Servicio disponible
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/properties:
    get:
      operationId: listProperties
      summary: Lista propiedades con paginacion
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Listado paginado de propiedades
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Parametros de paginacion invalidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
    post:
      operationId: createProperty
      summary: Crea una propiedad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Propiedad creada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Solicitud invalida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
  /api/properties/{id}:
    get:
      operationId: getPropertyById
      summary: Obtiene una propiedad por id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Propiedad encontrada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Id invalido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Propiedad no encontrada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      operationId: updateProperty
      summary: Actualiza una propiedad por id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Propiedad actualizada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Solicitud invalida
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Propiedad no encontrada
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    PropertyStatus:
      type: string
      description: Estado funcional de una propiedad.
      enum:
        - Available
        - Reserved
        - Sold
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: {}
    HttpValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
