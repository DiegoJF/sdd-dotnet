installed:
  - agent-context
  - spec-status
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
    - extension: agent-context
      command: speckit.agent-context.update
      enabled: true
      optional: true
      priority: 10
      prompt: Execute speckit.agent-context.update?
      description: Refresh agent context after specification
      condition: null
  after_plan:
    - extension: agent-context
      command: speckit.agent-context.update
      enabled: true
      optional: true
      priority: 10
      prompt: Execute speckit.agent-context.update?
      description: Refresh agent context after planning
      condition: null
  before_implement:
    - extension: spec-status
      command: speckit.spec-status.begin
      enabled: true
      optional: false
      priority: 5
      description: Transicionar a En implementación antes de ejecutar tareas
      condition: null
  after_implement:
    - extension: spec-status
      command: speckit.spec-status.complete
      enabled: true
      optional: false
      priority: 5
      description: Verificar tareas y evidencia antes de declarar Implementada
      condition: null
