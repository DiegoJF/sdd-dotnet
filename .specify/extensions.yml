installed:
- agent-context
settings:
  auto_execute_hooks: true
hooks:
  before_implement:
  - extension: agent-context
    command: speckit.spec-status.before-implement
    enabled: true
    optional: false
    priority: 5
    prompt: Ejecutar transición automática a En implementación?
    description: Valida transición permitida y fija estado En implementación al inicio
    condition: null
  after_implement:
  - extension: agent-context
    command: speckit.spec-status.after-implement
    enabled: true
    optional: false
    priority: 5
    prompt: Ejecutar cierre automático del estado del spec?
    description: Cierra a Implementada solo si tasks y quickstart cumplen validaciones
    condition: null
  after_specify:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after specification
    condition: null
  after_plan:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after planning
    condition: null
